name: Automated Scraping & Training

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  scrape-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detect latest patch
        id: patch
        working-directory: backend
        run: |
          PATCH=$(python -c "import requests; r = requests.get('https://ddragon.leagueoflegends.com/api/versions.json'); print(r.json()[0])")
          echo "LATEST_PATCH=$PATCH" >> $GITHUB_OUTPUT
          echo "Latest patch: $PATCH"

      - name: Check if patch already scraped
        id: check
        working-directory: backend
        run: |
          PATCH="${{ steps.patch.outputs.LATEST_PATCH }}"
          if [ -d "scraped_data/riot_stats/patch_$PATCH" ]; then
            echo "ALREADY_SCRAPED=true" >> $GITHUB_OUTPUT
            echo "Patch $PATCH already scraped, skipping scraping"
          else
            echo "ALREADY_SCRAPED=false" >> $GITHUB_OUTPUT
            echo "Patch $PATCH not found, will scrape"
          fi

      - name: Run scraper for all ranks
        if: steps.check.outputs.ALREADY_SCRAPED == 'false'
        working-directory: backend
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          SECRET_KEY: "github-actions-dummy-secret-key-for-scraping-only"
          DATABASE_URL: "sqlite:///./tryndraft_ci.db"
        run: |
          python scripts/run_scrapers.py stats --mode full

      - name: Train NN models on new data
        if: steps.check.outputs.ALREADY_SCRAPED == 'false'
        working-directory: backend
        env:
          SECRET_KEY: "github-actions-dummy-secret-key-for-training-only"
          DATABASE_URL: "sqlite:///./tryndraft_ci.db"
        run: |
          python scripts/train_nn.py --all --epochs 30

      - name: Commit and push changes
        if: steps.check.outputs.ALREADY_SCRAPED == 'false'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add backend/scraped_data/
          git add backend/models/
          git commit -m "Auto-scrape: Patch ${{ steps.patch.outputs.LATEST_PATCH }} data + retrained models" || echo "No changes to commit"
          git push

      - name: Create summary
        run: |
          echo "## Scraping & Training Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Patch:** ${{ steps.patch.outputs.LATEST_PATCH }}" >> $GITHUB_STEP_SUMMARY
          echo "**Already Scraped:** ${{ steps.check.outputs.ALREADY_SCRAPED }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.ALREADY_SCRAPED }}" == "false" ]; then
            echo "**Action:** Scraped new data and retrained models ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Action:** Skipped (data already exists) ⏭️" >> $GITHUB_STEP_SUMMARY
          fi
